<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

.form-control
{
    width: 195px;
}

</style>
<body>
<form action="">
    <table align="center" cellspacing="10">
    <tr>
        <th colspan="2">User Registration Form</th>
    </tr>
    <tr>
        <td>
            <label>Full Name</label>
        </td>
        <td>
            <input type="text" name="name" class="form-control" placeholder="Enter Your Full Name Here">
        </td>
    </tr>
    <tr>
        <td>
            <label>Email Address</label>
        </td>
        <td>
            <input type="email" name="email" class="form-control" placeholder="Enter Your Email Here">
        </td>
    </tr>
    <tr>
        <td>
            <label>Password</label>
        </td>
        <td>
            <input type="password" name="password" class="form-control" placeholder="Enter Your Password Here">
        </td>
    </tr>
    <tr>
        <td>
            <label>Age</label>
        </td>
        <td>
            <input type="number" name="age" min="1" max="100" class="form-control" placeholder="Enter Your Age Here">
        </td>
    </tr>
    <tr>
        <td>
            <label>Select Gender</label>
        </td>
        <td>
            <select name="Gender" id="" class="form-control">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select    >
        </td>
    </tr>
    <tr>
        <td>
            <label>Date Of Birth</label>
        </td>
        <td>
            <input type="date" name="dob" class="form-control">
        </td>
    </tr>
    <tr>
        <td>
            <label>Select Color</label>
        </td>
        <td>
            <input type="color" name="color" class="form-control">
        </td>
    </tr>
    <tr>
        <td>
            <label>Select Country</label>
        </td>
        <td>
            <select name="Country" id="" class="form-control">
                <option value="Pakistan">Pakistan</option>
                <option value="India">Afghanistan</option>
                <option value="USA">China</option>
            </select>
        </td>
    </tr>
    <tr>
        <td colspan="2" align="center">
            <input type="submit" class="form-control">
        </td>
    </tr>
</table>
</form>
</body>
</html>
