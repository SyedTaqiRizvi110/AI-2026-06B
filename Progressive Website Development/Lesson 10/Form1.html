<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

input
{
    width:195px;
}

</style>
<body>
<form action="">
    <label>Full Name</label>
    <input type="text" name="name" placeholder="Enter Your Full Name Here">
    <br>

    <label>Email Address</label>
    <input type="email" name="email" placeholder="Enter Your Email Here">
    <br>

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter Your Password Here">
    <br>

    <label>Age</label>
    <input type="number" name="age" min="1" max="100" placeholder="Enter Your Age Here">
    <br>

    <label>Select Gender</label>
    <select name="Gender" id="">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
    <br>

    <label>Date Of Birth</label>
    <input type="date" name="dob">
    <br>

    <label>Select Color</label>
    <input type="color" name="color">
    <br>

    <label>Select Country</label>
    <select name="Country" id="">
        <option value="Pakistan">Pakistan</option>
        <option value="India">Afghanistan</option>
        <option value="USA">China</option>
    </select>
    <br>
    <input type="submit">
</form>
</body>
</html>
