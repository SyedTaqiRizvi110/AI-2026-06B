<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .menue{
        list-style-type:none;
        text-align: center;
    }
    .menue li{
        display: inline;
        margin: 10px;
        color: white;
    }
    body{
        margin: auto;
        background-color: black;
    }
    .container{
        width: 80%;
        margin-left: 10%;
    }
    .header{
        width: 100%;
        height: 400px;
        background-color: beige;
    }
    .section{
        width: 100%;
        height: 700px;
        background-color: rgba(95, 158, 160,0.5);
    }
    .card{
        width:350px ;
        height: 250px;
        margin: 10px;
        margin-top: 50px;
        margin-left: 150px;
        float: left;
        background-position: center;
        background-size: cover;
        background-color: blue;
    }
    .card2{
        float: right;
        margin-right: 10%;
    }

    .footer{
        width: 100%;
        height: 200px;
        background-color: green;
    }
    .square{
        width: 350px;
        height: 200px;
        margin: 10px;
        margin-top: 0%;
        float: right;
        background-position: center;
           background-color:chartreuse;
     
           
    }
    .square1{
        background-color: pink;
        width: 700px;
        float: left;
    }
    .square2{
        background-color: darkcyan;
        margin-right: 20px;
        float: left;
        width: 400px;

    }
    .square3{
        background-color: darkslateblue;
        float: right;
    }
    
</style>
<body>
    <ul class="menue">
        <li>HOME</li>
        <li>SERVICE</li>
        <li>ABOUT US</li>
        <li>CONTACT</li>
    </ul>
    <div class="container">
    <div class="header"></div>
    <div class="section">
        <div class="card card1"></div>
        <div class="card card2"></div>
    
    </div>
  <div class="footer">
    <div class="square square1"></div>
    <div class="square square2"></div>
    <div class="square square3"></div>
  </div>
  </div>
</body>
</html>
