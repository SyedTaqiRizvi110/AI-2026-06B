<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel:wght@400..900&family=Dancing+Script:wght@400..700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

/* <weight>: Use a value from 1 to 1000
<uniquifier>: Use a unique and descriptive class name */

.Text{
  font-family: "Google Sans Flex", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
  font-variation-settings:
    "slnt" 0,
    "wdth" 100,
    "GRAD" 0,
    "ROND" 0;
}

.dancingscript{
  font-family: "Dancing Script", cursive;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
}

.bungeeregular {
  font-family: "Bungee", sans-serif;
  font-weight: 400;
  font-style: normal;
}

.cinzel{
  font-family: "Cinzel", serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
}

</style>
<body>
<h1 class="Text">My Font Collection</h1>
<h1 class="dancingscript">New Font</h1>
<h1 class="bungeeregular">Another Font</h1>
<h2 class="bungeeregular">Font Details</h2>
<p class="cinzel">This is a simple paragraph to demonstrate the font.</p>
</body>
</html>
