<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

.container div
{
    background: grey;
    color: white;
    padding: 20px;
    text-align: center;
    /* margin: 5px; */
}

.container
{
    display: grid;
    /* grid-template-columns: 100px 200px 300px 400px 500px 600px; */
    /* grid-template-columns: 2fr 1fr 2fr; */
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 150px 300px 150px;
    gap: 50px;
}


</style>
<body>
    <div class="container">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
        <div>Five</div>
        <div>Six</div>
    </div>
</body>
</html>
