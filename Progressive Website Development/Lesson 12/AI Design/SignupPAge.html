<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef4f8;
            color: #172b4d;
            font-family: Arial, sans-serif;
        }

        .signup-page {
            width: min(960px, 100%);
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            overflow: hidden;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(23, 43, 77, 0.15);
        }

        .intro {
            padding: 56px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #173f5f;
            color: #ffffff;
        }

        .intro h1 {
            margin: 0 0 18px;
            font-size: 42px;
            line-height: 1.1;
        }

        .intro p {
            margin: 0;
            color: #d9ebf5;
            font-size: 17px;
            line-height: 1.7;
        }

        .form-area {
            padding: 48px;
        }

        .form-area h2 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .form-intro {
            margin: 0 0 28px;
            color: #60738e;
        }

        .signup-form {
            display: grid;
            gap: 20px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #c9d5e2;
            border-radius: 8px;
            color: #172b4d;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: #20639b;
            box-shadow: 0 0 0 3px rgba(32, 99, 155, 0.14);
        }

        .hint {
            margin: 0;
            color: #718096;
            font-size: 12px;
        }

        button {
            margin-top: 4px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #f6a01a;
            color: #172b4d;
            cursor: pointer;
            font: bold 16px Arial, sans-serif;
        }

        button:hover {
            background: #e58d08;
        }

        .login-note {
            margin: 22px 0 0;
            text-align: center;
            color: #60738e;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            body {
                padding: 16px;
                align-items: flex-start;
            }

            .signup-page {
                grid-template-columns: 1fr;
                margin: 16px 0;
            }

            .intro {
                padding: 32px 28px;
            }

            .intro h1 {
                font-size: 34px;
            }

            .form-area {
                padding: 32px 28px;
            }
        }
    </style>
</head>
<body>
    <main class="signup-page">
        <section class="intro">
            <h1>Start something great.</h1>
            <p>Create your account and join a community built for learning, sharing, and growing together.</p>
        </section>

        <section class="form-area">
            <h2>Create an account</h2>
            <p class="form-intro">Enter your details to get started.</p>

            <form class="signup-form" action="#" method="post">
                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="field">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" name="contact" placeholder="+92 300 1234567" required>
                    <p class="hint">Please include Pakistan's country code, +92.</p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter a strong password" minlength="8" required>
                </div>

                <button type="submit">Create account</button>
            </form>

            <p class="login-note">Already have an account? Log in</p>
        </section>
    </main>
</body>
</html>
