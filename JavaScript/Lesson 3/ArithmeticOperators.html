<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>

// Arithmetic Operators
/*

    +   Addition
    -   Subtraction
    *   Multiplication
    /   Division
    %   Modulus (Remainder)
    ++  Increment
    --  Decrement
*/

var a = 25;
var b = 4;

var Add = a + b;
document.write(Add + "<br>");

var Subtract = a - b;
document.write(Subtract + "<br>");

var Multiply = a * b;
document.write(Multiply + "<br>");

var Divide = a / b;
document.write(Divide + "<br>");

var Modulus = a % b;
document.write(Modulus + "<br>");

</script>
</body>
</html>
