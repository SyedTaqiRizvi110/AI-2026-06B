<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>

let a = 4;
let b = 5;

document.write("The given value of A is: " + a + "<br>");
document.write("The given value of B is: " + b + "<br>");

a = a + b; // 4 + 5 = 9
b = a - b; // 9 - 5 = 4
a = a - b; // 9 - 4 = 5 

document.write("The required value of A is: " + a + "<br>");
document.write("The required value of B is: " + b + "<br>");

</script>
</body>
</html>
