<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>

let Gender = prompt("Select Gender \n1. M \n2. F").toLowerCase();

switch(Gender)
{
    case "m":
        document.write("Male");
        break;

    case "f":
        document.write("Female");
        break;

    default:
        alert("Invalid Gender Selection");
        break;
}

</script>
</body>
</html>
