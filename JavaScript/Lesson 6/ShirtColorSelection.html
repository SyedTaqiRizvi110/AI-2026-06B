<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>

let ShirtColor = prompt("Select a Shirt Color \n1. Red \n2. Green \n3. Blue \n4. Yellow").toLowerCase();

if(ShirtColor == "red")
{
    document.write("You have selected Red Shirt");
}
else if(ShirtColor == "green")
{
    document.write("You have selected Green Shirt");
}
else if(ShirtColor == "blue")
{
    document.write("You have selected Blue Shirt");
}
else if(ShirtColor == "yellow")
{
    document.write("You have selected Yellow Shirt");
}
else
{
    document.write("Invalid Color Selection");
}

</script>
</body>
</html>
